[project]
name = "bup-energy-root"
version = "0.1.0"
description = "GridWise LLM-Assisted Energy Optimization - Root workspace"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
workspace = { members = ["backend"] }
dev-dependencies = [
    "ruff>=0.9.0",
    "mypy>=1.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "T20", "PIE", "PT", "Q", "RSE", "RET", "SLF", "TRY", "ARG", "PTH", "ERA", "PD", "PGH", "PL", "TRY"]
ignore = ["S101", "S106", "S311", "B008", "B009", "B011", "C408", "PTH118", "PTH123", "PLW0602", "PLW0603"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict = true
