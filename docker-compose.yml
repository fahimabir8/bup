# A single-service Docker Compose file. The GridWise image exposes
# both the FastAPI backend (port 8000) and the static frontend
# (port 8001); one container, one `docker compose up`.

services:
  gridwise:
    build:
      context: .
      dockerfile: Dockerfile
    image: gridwise:latest
    container_name: gridwise
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"   # FastAPI (POST /optimize-energy, GET /health)
      - "8001:8001"   # static frontend (UI served from project root)
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
